<article class="kistl-card" (click)="open()">
  <div class="card-topline">

    <div class="card-title-wrapper">
      <strong class="card-title">
        {{ card.name }}
      </strong>
      <span class="card-tooltip">
        {{ card.name }}
      </span>
    </div>

    <span class="status-pill">
      {{ workflow.statusLabel }}
    </span>
  </div>

  <div class="card-meta">
    <p>
      <span>Geplantes Posting:</span>
      {{ formatShortDate(card.plannedPostingDate) }}
    </p>

    <p *ngIf="card.part">
      <span>Part:</span>
      {{ card.part }}
    </p>
  </div>

  <p *ngIf="card.review.status === 'declined'" class="declined-note">
    Änderungen nötig
  </p>
</article>
